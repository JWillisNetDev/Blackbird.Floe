name: staging

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  IMAGE_TAG: ${{ github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test
      - name: OpenAPI Drift Check
        run: |
          dotnet build
          git diff --exit-code -- floe-web/openapi/floe-api.json

  package:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: floe-web/package-lock.json
      - name: Build floe-web
        working-directory: floe-web
        run: |
          npm ci
          npm run build
      - name: Stage SPA into API wwwroot
        run: |
          rm -rf Blackbird.Floe.Api/wwwroot
          cp -r floe-web/dist Blackbird.Floe.Api/wwwroot
      - name: Build and Push API Image
        run: |
          dotnet publish Blackbird.Floe.Api -t:PublishContainer \
            -p:ContainerRuntimeIdentifier=linux-arm64 \
            -p:ContainerRegistry=${{ steps.ecr.outputs.registry }} \
            -p:ContainerRepository=floe-api \
            -p:ContainerImageTags=$IMAGE_TAG 
      - name: Build and Push EF Bundle Image
        env:
          OpenApiGenerateDocuments: "false"
        run: |
          dotnet tool restore
          dotnet ef migrations bundle \
            --project Blackbird.Floe.Data \
            --startup-project Blackbird.Floe.Api \
            -r linux-arm64 \
            --self-contained \
            -o efbundle
          docker build -f infrastructure/deploy/migrate.Dockerfile -t ${{ steps.ecr.outputs.registry }}/floe-migrate:$IMAGE_TAG .
          docker push ${{ steps.ecr.outputs.registry }}/floe-migrate:$IMAGE_TAG

  migrate:
    needs: package
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform Init
        working-directory: infrastructure/envs/staging
        run: terraform init -input=false
      - name: Terraform Apply Migrate
        working-directory: infrastructure/envs/staging
        id: tf
        run: |
          terraform apply -input=false -auto-approve \
            -var image_tag=$IMAGE_TAG \
            -var engine_version=${{ vars.ENGINE_VERSION }} \
            -var admin_cidrs='${{ secrets.ADMIN_CIDRS }}' \
            -target=module.services.aws_ecs_task_definition.migrate \
            -target=module.database
          {
            echo "cluster=$(terraform output -raw cluster_name)"
            echo "task_definition=$(terraform output -raw migrate_task_definition_arn)"
          } >> "$GITHUB_OUTPUT"
      - name: Run migration task
        id: run
        run: |
          arn=$(aws ecs run-task --cluster "${{ steps.tf.outputs.cluster }}" \
            --task-definition "${{ steps.tf.outputs.task_definition }}" \
            --launch-type FARGATE \
            --query 'tasks[0].taskArn' --output text)
          echo "task_arn=$arn" >> "$GITHUB_OUTPUT"
          aws ecs wait tasks-stopped --cluster "${{ steps.tf.outputs.cluster }}" --tasks "$arn"
          exit_code=$(aws ecs describe-tasks \
            --cluster "${{ steps.tf.outputs.cluster }}" \
            --tasks "$arn" \
            --query "tasks[0].containers[0].exitCode" \
            --output text)
          echo "exitCode=$exit_code"
          [ "$exit_code" = "0" ]
  
