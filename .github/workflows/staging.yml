name: staging

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  IMAGE_TAG: ${{ github.sha }}
  

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test
      - name: OpenAPI Drift Check
        run: |
          dotnet build
          git diff --exit-code -- floe-web/openapi/floe-api.json

  package:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: floe-web/package-lock.json
          
      - name: Build floe-web
        working-directory: floe-web
        run: |
          npm ci
          npm run build
      - name: Stage SPA into API wwwroot
        run: |
          rm -rf Blackbird.Floe.Api/wwwroot
          cp -r floe-web/dist Blackbird.Floe.Api/wwwroot

      - name: Check for Existing API Image
        id: api_exists
        run: |
          if aws ecr describe-images --repository-name "floe-api" --image-ids imageTag=$IMAGE_TAG >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and Push API Image
        if: steps.api_exists.outputs.found != 'true'
        run: |
          dotnet publish Blackbird.Floe.Api -t:PublishContainer \
            -p:ContainerRuntimeIdentifier=linux-x64 \
            -p:ContainerRegistry=${{ steps.ecr.outputs.registry }} \
            -p:ContainerRepository=floe-api \
            -p:ContainerImageTags=$IMAGE_TAG

      - name: Check for Existing EF Bundle Image
        id: migrate_exists
        run: |
          if aws ecr describe-images --repository-name "floe-migrate" --image-ids imageTag=$IMAGE_TAG >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and Push EF Bundle Image
        if: steps.migrate_exists.outputs.found != 'true'
        env:
          OpenApiGenerateDocuments: "false"
        run: |
          dotnet tool restore
          dotnet ef migrations bundle \
            --project Blackbird.Floe.Data \
            --startup-project Blackbird.Floe.Api \
            -r linux-x64 \
            --self-contained \
            -o efbundle
          docker build -f infrastructure/deploy/migrate.Dockerfile -t ${{ steps.ecr.outputs.registry }}/floe-migrate:$IMAGE_TAG .
          docker push ${{ steps.ecr.outputs.registry }}/floe-migrate:$IMAGE_TAG

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: infrastructure/envs/staging
    env:
      TF_VAR_engine_version: ${{ vars.ENGINE_VERSION }}
      TF_VAR_admin_cidrs: ${{ secrets.ADMIN_CIDRS }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: |
          terraform plan -out tfplan -var image_tag=$IMAGE_TAG
          {
            echo '### Terraform Plan'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        run: terraform apply -input=false tfplan

      - name: Wait Until Stable
        run: |
          aws ecs wait services-stable \
            --cluster "$(terraform output -raw cluster_name)" \
            --services "$(terraform output -raw service_name)"