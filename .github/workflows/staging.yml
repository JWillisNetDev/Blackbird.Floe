name: staging

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-2
  IMAGE_TAG: ${{ github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test
      - name: OpenAPI Drift Check
        run: |
          dotnet build
          git diff --exit-code -- floe-web/openapi/floe-api.json

  package:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: floe-web/package-lock.json
      - name: Build floe-web
        working-directory: floe-web
        run: |
          npm ci
          npm run build
      - name: Stage SPA into API wwwroot
        run: |
          rm -rf src/Blackbird.Floe.Api/wwwroot
          cp -r floe-web/dist src/Blackbird.Floe.Api/wwwroot
      - name: API Image
        run: >
          dotnet publish src/Blackbird.Floe.Api -t:PublishContainer
          -p:ContainerRuntimeIdentifier=linux-arm64
          -p:ContainerRegistry=${{ steps.ecr.outputs.registry }}
          -p:ContainerRepository=floe-api
          -p:ContainerImageTags=$IMAGE_TAG
      - name: EF Bundle Image
        run: |
          dotnet tool install -g dotnet-ef
          dotnet ef migrations bundle \
            --project src/Blackbird.Floe.Data --startup-project src/Blackbird.Floe.Api \
            -r linux-arm64 --self-contained -o efbundle
          docker build -f deploy/migrator.Dockerfile -t ${{ steps.ecr.outputs.registry }}/floe-migrate:$IMAGE_TAG .
          docker push ${{ steps.ecr.outputs.registry }}/floe-migrate:$IMAGE_TAG
  
  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/envs/staging
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init
      - name: Migrate Task Definition
        run: terraform apply -auto-approve -var-file=staging.tfvars -var image_tag=$IMAGE_TAG -target=module.service.aws_ecs_task_definition.migrate
      - name: Migrate
        run: ../../../deploy/migrate.sh
      - name: Rollout
        run: terraform apply -auto-approve -var-file=staging.tfvars -var image_tag=$IMAGE_TAG
      - name: Wait until Stable
        run: aws ecs wait service-stable --cluster "$(terraform output -raw cluster_name)" --services "$(terraform output -raw service_name)"